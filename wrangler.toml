name = "pchess-github-io"
main = "src/index.ts"
compatibility_date = "2026-08-06"

# Phục vụ trang tĩnh (index.html, css, js) + chuyển /room, /health cho worker
[assets]
directory = "."
not_found_handling = "none"

# Durable Object: relay WebSocket + validate nước đi (server-authoritative)
[[durable_objects.bindings]]
name = "PCHESS_ROOM"
class_name = "PChessRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PChessRoom"]
