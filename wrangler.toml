name = "pchess-github-io"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Static assets: worker serve qua binding ASSETS (chỉ index.html, css, js)
[assets]
directory = "public"
binding = "ASSETS"

# Durable Object: relay WebSocket + validate nước đi (server-authoritative)
[[durable_objects.bindings]]
name = "PCHESS_ROOM"
class_name = "PChessRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PChessRoom"]
